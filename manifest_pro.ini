CHANGELOG = "Version 1.5.0
- judge a whole event, not just one run. Runs are saved, ranked, compared and replayed. Battles get their own scoring. Everyone on the server can watch a live leaderboard. And judges can now share a full track setup with one file.
* Run History & Leaderboard
- Every run saved with full score, zones, speed, angle, collisions, line score (opt-in)
- List view or best-of-driver leaderboard, filterable by name
- Compare two runs side by side, score gap in green/red per zone
- Manual score override by judges
- One-click replay of any run
- Battle runs highlighted with their own marker
* Online Leaderboard
- Shared leaderboard per server/track, visible to everyone
- Training servers: auto-submit, no judge needed
- Competition servers: judge validates and sends the score
* Battle Mode
- Chaser gets its own Chase Score based on proximity, speed and angle vs the lead
* Start Lights integration
- Reset scoring automatically when your pair's lights go
- Optional false start detection
* Camera freedom**
- The run no longer needs the camera on the lead car - scoring and recording keep following the right car even if you look elsewhere
* Rewritten: No-go zones
- Simpler and fairer: avoiding one no longer costs you anything, entering one subtracts its weight directly
* Paint zones/lines on the ground, zone measurements tab, RPM stats, in-game Help window (Scoring/Zones/Tools guides)
* Import/Export
- Share runs between judges, or a full track config between PCs, with one file
Also: full Vietnamese translation 🇻🇳, thanks to LSDC.
